name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        sudo apt-get update -qq 2>/dev/null
        sudo apt-get install -y -qq unzip wget curl 2>/dev/null || true
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/sdk.zip
        unzip -q /tmp/sdk.zip -d $HOME/android-sdk/cmdline-tools/latest
        export ANDROID_HOME=$HOME/android-sdk
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "Android SDK Complete"
        which sdkmanager && echo "sdkmanager found"
        which aapt && echo "aapt found"
        which zipalign && echo "zipalign found"

    - name: Install Gradle
      run: |
        curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: |
        set -x
        export ANDROID_HOME=$HOME/android-sdk
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        export JAVA_HOME=$JAVA_HOME
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GameBooster-debug
        path: app/build/outputs/apk/debug/*.apk
