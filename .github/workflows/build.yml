name: Build APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME/platform-tools/
        ls -la $ANDROID_HOME/build-tools/

    - name: Install Gradle
      run: |
        curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: |
        set -x
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        export JAVA_HOME=$JAVA_HOME
        gradle clean assembleDebug --no-daemon --stacktrace
        ls -la app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release
      id: release
      uses: softprops/action-gh-release@v2
      with:
        name: Game Booster Extreme v1.0.0
        tag_name: v1.0.0
        body: |
          ## Game Booster Extreme - Android Optimizer
          
          ### Features:
          - Dashboard monitor: RAM, CPU, Storage, Battery, Temperature
          - Extreme Boost mode (kill background apps, clean memory)
          - Quick Clean one-tap optimizer
          - Auto-detect games (Roblox, Free Fire, etc.)
          - Temperature monitor
          - Settings with animation scale control
          - Material Design dark theme UI
          
          ### Build Info:
          - Version: 1.0.0
          - Build Date: ${{ github.run_date }}
          - Build Number: ${{ github.run_number }}
        file: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK (Fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: GameBooster-debug
        path: app/build/outputs/apk/debug/*.apk
