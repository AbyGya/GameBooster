name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME/platform-tools/ 2>/dev/null || echo "No platform-tools"
        ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"

    - name: Install Gradle
      run: |
        curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: |
        set -x
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        export JAVA_HOME=$JAVA_HOME
        gradle clean assembleDebug --no-daemon --stacktrace
        find app/build/outputs -name "*.apk" -exec ls -la {} \;

    - name: Create Release & Upload APK
      run: |
        # Find the APK file
        APK_FILE=$(find app/build/outputs -name "*.apk" | head -1)
        echo "APK found: $APK_FILE"
        cp "$APK_FILE" /tmp/GameBooster-debug.apk
        ls -la /tmp/GameBooster-debug.apk
        
        # Create GitHub Release using gh CLI
        gh release create v1.0.1 \
          /tmp/GameBooster-debug.apk \
          --title "Game Booster Extreme v1.0.1" \
          --notes "## Game Booster Extreme - Android Optimizer
          
          ### Features:
          - Dashboard monitor: RAM, CPU, Storage, Battery, Temperature
          - Extreme Boost mode (kill background apps, clean memory)
          - Quick Clean one-tap optimizer
          - Auto-detect games (Roblox, Free Fire, etc.)
          - Temperature monitor
          - Settings with animation scale control
          - Material Design dark theme UI
          
          ### Build Info:
          - Version: 1.0.1
          - Build Date: ${{ github.run_date }}
          - Build Number: ${{ github.run_number }}" \
          --prerelease || echo "Release creation failed, trying alternative..."

    - name: Upload APK (Fallback)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GameBooster-debug
        path: app/build/outputs/apk/debug/*.apk
