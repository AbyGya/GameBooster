name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/platform-tools/ || echo "platform-tools missing"
        ls -la $ANDROID_HOME/build-tools/ || echo "build-tools missing"
        sdkmanager --list 2>/dev/null | head -5 || echo "sdkmanager not found"

    - name: Install Gradle
      run: |
        curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: |
        set -x
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        export ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk
        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        export JAVA_HOME=$JAVA_HOME
        gradle clean assembleDebug --no-daemon --stacktrace
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK"

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GameBooster-debug
        path: app/build/outputs/apk/debug/*.apk
